[project]
name = "self-steer"
version = "0.1.0"
description = "Qwen3.5-4B switches its own neuron and weight edits mid-conversation, and can ask Claude to build new ones."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mlx==0.31.2",
  "mlx-lm==0.31.3",
  "mcp>=2.3,<3",
  "numpy",
]

[project.scripts]
selfsteer = "selfsteer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfsteer"]
