<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>self-steer · Qwen edits its own neurons</title>
<style>
  :root { --bg:#0d0f12; --panel:#15181d; --line:#262a31; --text:#e7e9ee; --muted:#8b93a1; --accent:#7cc4ff; --ok:#6ad49b; --warn:#f2c46d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:14px; padding:16px 22px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; letter-spacing:.2px; }
  header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 340px; height: calc(100vh - 58px); }
  #chat { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); }
  #log { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width: 820px; padding:12px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#22303f; }
  .qwen { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .qwen .who, .user .who { font-size:11px; color:var(--muted); margin-bottom:4px; letter-spacing:.4px; text-transform:uppercase; }
  .chip { align-self:flex-start; font-size:12.5px; padding:6px 10px; border-radius:999px; border:1px solid var(--line); background:#111419; color:var(--muted); }
  .chip b { color:var(--text); font-weight:600; }
  .chip.edit { border-color: var(--c, var(--accent)); color: var(--text); }
  .chip.ask { border-color: var(--warn); }
  .chip.built { border-color: var(--ok); }
  .tok.steered { background: color-mix(in srgb, var(--c) 28%, transparent); border-radius:3px; box-shadow: inset 0 -2px 0 var(--c); }
  .stats { font-size:11.5px; color:var(--muted); margin-top:6px; }
  form { display:flex; gap:10px; padding:14px 22px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15px; }
  button { background:#222833; color:var(--text); border:1px solid var(--line); border-radius:9px; padding:9px 13px; font-size:13.5px; cursor:pointer; }
  button:hover { border-color:#3a4250; }
  button.primary { background:#2b6cb0; border-color:#2b6cb0; }
  aside { overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:18px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 8px; }
  .mode { border:1px solid var(--line); border-left:4px solid var(--c); border-radius:10px; padding:10px 12px; background:var(--panel); margin-bottom:8px; }
  .mode .name { font-weight:600; display:flex; justify-content:space-between; gap:8px; }
  .mode .by { font-size:11px; color:var(--muted); font-weight:400; }
  .mode .desc { font-size:12.5px; color:#c3c8d2; margin:4px 0 6px; }
  .mode .meta { font-size:11.5px; color:var(--muted); }
  .mode button { margin-top:8px; padding:5px 9px; font-size:12px; }
  .mode.armed { box-shadow: 0 0 0 1px var(--c); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; }
  #reqs div { font-size:12.5px; color:#c3c8d2; padding:6px 0; border-bottom:1px dashed var(--line); }
  .muted { color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<header><h1>self-steer</h1><span>Qwen3.5-4B can switch its own neurons, and ask Claude to build new ones</span></header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="f"><input id="q" type="text" placeholder="Ask Qwen something…" autocomplete="off"><button class="primary">Send</button></form>
  </section>
  <aside>
    <div><h2>Modes</h2><div id="modes"></div></div>
    <div><h2>Requests to Claude</h2><div id="reqs"><span class="muted">None yet.</span></div></div>
    <div><h2>Conversation</h2>
      <div class="row"><span class="muted">memory after an edit</span>
        <select id="policy"><option value="keep">keep steered cache</option><option value="reprefill">re-prefill clean</option></select>
        <button id="reset">New chat</button></div>
      <p class="muted" id="sess"></p></div>
  </aside>
</main>
<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let cur = null, state = null;
const hue = n => [...n].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const color = n => n === 'lazy' ? '#7cc4ff' : n === 'detailed' ? '#c792ea' : `hsl(${hue(n)} 70% 65%)`;
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const scroll = () => log.scrollTop = log.scrollHeight;
function chip(html, cls = '', c = '') { const d = document.createElement('div'); d.className = 'chip ' + cls; if (c) d.style.setProperty('--c', c); d.innerHTML = html; log.appendChild(d); scroll(); }
function bubble(cls, who) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = `<div class="who">${who}</div><div class="body"></div>`; log.appendChild(d); scroll(); return d; }
function describe(m) {
  const n = m.neurons ? `${m.neurons} neurons, ` : '';
  const k = m.kind === 'ablate' ? 'rank-1 weight edit on ' : '';
  const w = m.window ? `first ${m.window} tokens` : 'whole answer';
  return `${k}${n}${m.layers.length} layers · ${w}`;
}
async function refresh() {
  state = await (await fetch('/api/state')).json();
  const armed = new Set(state.session.armed.map(a => a.name));
  $('#modes').innerHTML = state.modes.map(m => `
    <div class="mode ${armed.has(m.name) ? 'armed' : ''}" style="--c:${color(m.name)}">
      <div class="name">${esc(m.name)} <span class="by">${m.author === 'builtin' ? 'built in' : 'by ' + esc(m.author)}</span></div>
      <div class="desc">${esc(m.description || '')}</div>
      <div class="meta">${describe(m)}</div>
      <button onclick="force('${m.name}')">use for next answer</button>
    </div>`).join('') + `<button onclick="force('normal')">clear (normal)</button>`;
  const reqs = state.requests;
  $('#reqs').innerHTML = reqs.length ? reqs.map(r => `<div>#${r.id} “${esc(r.description)}” → <b>${r.status}</b>${r.mode ? ' · ' + esc(r.mode) : ''}</div>`).join('') : '<span class="muted">None yet.</span>';
  $('#policy').value = state.session.cache_policy;
  $('#sess').textContent = `${state.session.turns} turns · ${state.session.ledger_tokens} tokens in cache`;
}
window.force = async name => { await fetch('/api/mode', {method:'POST', body: JSON.stringify({name})}); refresh(); };
$('#reset').onclick = async () => { await fetch('/api/reset', {method:'POST', body: JSON.stringify({cache_policy: $('#policy').value})}); log.innerHTML = ''; refresh(); };
$('#policy').onchange = () => $('#reset').click();
$('#f').onsubmit = async e => {
  e.preventDefault(); const q = $('#q').value.trim(); if (!q) return;
  $('#q').value = '';
  const r = await fetch('/api/chat', {method:'POST', body: JSON.stringify({message: q})});
  if (!r.ok) chip(esc((await r.json()).error || 'busy'));
};
function handle(e) {
  if (e.type === 'user') { const b = bubble('user', 'you'); b.querySelector('.body').textContent = e.text; cur = null; }
  else if (e.type === 'steer') { e.modes.forEach(m => { const w = e.windows[m]; chip(`⚡ <b>${esc(m)}</b> edit live ${w ? 'for the first ' + w + ' tokens' : 'for this answer'}`, 'edit', color(m)); }); cur = null; }
  else if (e.type === 'token') {
    if (!cur) cur = bubble('qwen', 'qwen3.5-4b').querySelector('.body');
    const s = document.createElement('span'); s.className = 'tok' + (e.modes.length ? ' steered' : '');
    if (e.modes.length) s.style.setProperty('--c', color(e.modes[0]));
    s.textContent = e.text; cur.appendChild(s); scroll();
  }
  else if (e.type === 'tool_call') { cur = null; const a = e.arguments || {}; chip(`🔧 Qwen called <b>${esc(e.name)}</b>(${esc(Object.values(a).join(', '))})`); }
  else if (e.type === 'tool_result') { chip(esc(e.text)); }
  else if (e.type === 'mode') { refresh(); if (e.by !== 'qwen' && e.action === 'set') chip(`🎛️ ${e.by} armed <b>${esc(e.name)}</b>`, 'edit', color(e.name)); }
  else if (e.type === 'request') { chip(`🧠 Qwen asked Claude for a new mode: “${esc(e.description)}”`, 'ask'); refresh(); }
  else if (e.type === 'request_claimed') { chip(`Claude is building it…`, 'ask'); refresh(); }
  else if (e.type === 'library') { const m = e.mode; chip(`✅ Claude built <b>${esc(m.name)}</b>: ${describe(m)} in ${m.seconds}s`, 'built', color(m.name)); refresh(); }
  else if (e.type === 'request_done') { refresh(); }
  else if (e.type === 'reprefill') { chip(`↺ re-encoded ${e.tokens} tokens of memory without edits (${e.seconds}s)`); }
  else if (e.type === 'done') {
    if (cur) { const st = document.createElement('div'); st.className = 'stats'; st.textContent = `${e.reply.split(/\s+/).filter(Boolean).length} words · ${e.generated_tokens} tokens · ${e.seconds}s` + (e.modes_used.length ? ' · modes: ' + e.modes_used.join(', ') : ''); cur.parentElement.appendChild(st); }
    cur = null; refresh();
  }
  else if (e.type === 'reset') { refresh(); }
}
(async () => {
  const past = await (await fetch('/api/history')).json();
  past.forEach(handle);
  const es = new EventSource('/api/events');
  es.onmessage = ev => handle(JSON.parse(ev.data));
  refresh();
})();
</script>
</body>
</html>
